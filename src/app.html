<script>
/**
 * 웹앱 화면 동작
 * - 누르면 화면을 먼저 바꾸고(낙관적 업데이트) 저장은 google.script.run으로 뒤에서
 * - 저장이 실패하면 작은 안내 문구를 띄우고 서버 값으로 다시 불러옴
 * - 시트에서 바꾼 내용은 화면으로 돌아올 때·1분마다 다시 불러와 반영
 */
const HABIT_MAX = 10;
const SLOT_MIN = 10;
const MOOD_COLORS = ['', '#D9D6CE', '#D9D6CE', '#B9D3C7', '#7FA897', '#2F5D50'];
const WEEKDAYS = ['월', '화', '수', '목', '금', '토', '일'];
const FLAG = { MISSED: '미완', CARRIED: '넘어옴' }; // 할 일 이월표시
// 숨김 메모가 있는 항목 옆 작은 아이콘 (내용은 목록에 안 보임)
const NOTE_ICON = '<svg class="note-ic" viewBox="0 0 16 16" width="13" height="13" aria-label="메모 있음" role="img">' +
  '<path d="M3 2.5h7l3 3v8H3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>' +
  '<path d="M5.5 7.5h5M5.5 10h3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
const noteIcon = (memo) => (memo && String(memo).trim() ? ' ' + NOTE_ICON : '');
const TITLES = { today: '오늘', week: '위클리', month: '먼슬리', timeline: '타임라인' };

const S = {
  boot: null, tab: readPref('tab', 'today'), lastLoad: 0, pending: 0,
  weeks: {}, // 월요일 키 → 한 주 데이터 (불러온 주만)
  dayKey: null, // 오늘 탭에서 보는 날짜 (‹ ›로 이동)
  weekKey: null, // 위클리 탭에서 보는 주 (월요일)
  lastLocal: 0, // 이 기기에서 마지막으로 저장한 때 (다른 곳 변경 안내용)
  prefetching: {}, // 미리 받는 중인 주
  detail: null, // 위클리에서 연 요일 상세 (날짜 키)
  edit: null, // 편집 중인 할 일 {key, i}
  weekGrid: readPref('weekGrid', '') === '1', // 위클리 7칸 한 줄 보기
  ym: null, month: null, selDay: null,
  tl: { key: null, slots: null, brush: null, painting: false, mode: null, timer: null },
  syncing: 0, // 뒤에서 불러오는 중 (새로고침 아이콘만 돎)
};

/* ---------- 도우미 ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseKey = (k) => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const errText = (err) => (err && err.message) || String(err);
const sheetOpen = () => !$('#sheet-bg').hidden;
const mondayKey = (key) => { const d = parseKey(key); return keyOf(addDays(d, -((d.getDay() + 6) % 7))); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8); // 저장 요청 번호 (연타·재시도 막기)
const isEditing = () => {
  const a = document.activeElement;
  return !!S.edit || sheetOpen() || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('#view').contains(a));
};

function readPref(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function writePref(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장 안 돼도 동작 */ } }

/** 시간 글자 → 'HH:mm' (아니면 '') — 서버 normTime_과 같은 규칙 */
function normTime(text) {
  const s = String(text || '').trim().replace(/시\s*/, ':').replace(/분/, '');
  const m = s.match(/^(\d{1,2})(?::?(\d{2}))?(?::\d{2})?$/);
  if (!m || +m[1] > 23 || +(m[2] || 0) > 59) return '';
  return pad(+m[1]) + ':' + pad(+(m[2] || 0));
}

/** 시간 범위 → 'HH:mm' 또는 'HH:mm-HH:mm' (아니면 '') — 서버 normRange_와 같은 규칙 */
function normRange(text) {
  const s = String(text || '').trim();
  if (!s) return '';
  const parts = s.split(/\s*[-~–]\s*/);
  if (parts.length === 1) return normTime(s);
  if (parts.length !== 2) return '';
  const a = normTime(parts[0]), b = normTime(parts[1]);
  if (a && !parts[1]) return a;
  return a && b && b > a ? a + '-' + b : '';
}

/** 내용 앞·뒤의 '11-13', '11~13', '1100-1300' → {time, text} (시작·끝 둘 다 있을 때만), 없으면 null */
function splitTimeFromText(text) {
  const R = '(\\d{1,2}(?::?\\d{2})?\\s*[-~–]\\s*\\d{1,2}(?::?\\d{2})?)';
  const tries = [new RegExp('^' + R + '\\s+(.+)$'), new RegExp('^(.+?)\\s+' + R + '$')];
  for (let k = 0; k < tries.length; k++) {
    const m = String(text).trim().match(tries[k]);
    if (!m) continue;
    const t = normRange(k === 0 ? m[1] : m[2]);
    if (t.length === 11) return { time: t, text: (k === 0 ? m[2] : m[1]).trim() };
  }
  return null;
}

/** 꼬리표 글자 ('11:00-13:00' → '11:00–13:00') */
function timeTag(t) { return String(t).replace('-', '–'); }

/** 할 일 정렬 — 서버 sortTodos_와 같은 순서: 미완료(시간순) → 시간 없음 → 체크·미완 → 빈 줄 */
function sortTodos(rows) {
  const start = (r) => normRange(r[1]).slice(0, 5);
  const group = (r) => (r[0] || r[4] === FLAG.MISSED ? 2 : start(r) ? 0 : 1);
  return rows.filter((r) => String(r[2] || '').trim()).map((r, i) => ({ r, i })).sort((a, b) => {
    const g = group(a.r) - group(b.r);
    if (g) return g;
    if (group(a.r) === 0 && start(a.r) !== start(b.r)) return start(a.r) < start(b.r) ? -1 : 1;
    return a.i - b.i;
  }).map((x) => [x.r[0], normRange(x.r[1]) || x.r[1], x.r[2], x.r[3] || '', x.r[4] || '']); // [체크, 시간, 내용, 메모, 이월표시]
}

function todoRate(todos) {
  const filled = todos.filter((r) => r[2]);
  const done = filled.filter((r) => r[0]).length;
  return { done, total: filled.length, pct: filled.length ? Math.round((done / filled.length) * 100) : 0 };
}

/** 일요일·공휴일이면 빨간 날 */
function isRedDay(key, holiday) { return !!holiday || parseKey(key).getDay() === 0; }

function dayLabel(key) {
  const d = parseKey(key);
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WEEKDAYS[(d.getDay() + 6) % 7] + '요일';
}

/* ---------- 서버 호출 ---------- */
function call(fn, ...args) {
  const t0 = performance.now();
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler((r) => { logPerf(fn, t0, r); resolve(r); })
      .withFailureHandler((e) => { logPerf(fn, t0, null); reject(e); })[fn](...args);
  });
}

/* ---------- 속도 기록 (실제 처리 시간) ---------- */
const PERF_NAMES = { webBoot: '앱 열기', webRefresh: '새로고침(캘린더)', webSetTodos: '할 일 저장·체크', webCheckItem: '일정 체크',
  webSaveItem: '일정 저장', webDeleteItem: '일정 삭제', webGetWeek: '날짜 이동(주 불러오기)', webSetHabit: '습관 체크', webSetMood: '기분 저장',
  webSetMust: '꼭 끝낼 일', webSetWeekInfo: '주간 목표', webGetMonth: '먼슬리 열기', webGetTimeline: '타임라인 열기', webSetTimeline: '타임라인 저장' };

/** 호출마다 전체 시간(네트워크 포함)과 서버 처리 시간을 기기에 남김 (최근 100개) */
function logPerf(fn, t0, res) {
  try {
    const list = JSON.parse(localStorage.getItem('planner.v2.perf') || '[]');
    list.push({ fn: fn, total: Math.round(performance.now() - t0), server: res && typeof res === 'object' && res._ms ? res._ms : null, at: Date.now() });
    localStorage.setItem('planner.v2.perf', JSON.stringify(list.slice(-100)));
  } catch (e) { /* 기록 실패는 무시 */ }
}

/** 속도 기록 표: 작업별 횟수·평균 (서버 처리 / 전체) + 시트 편집·트리거(서버 기록) */
function openPerf() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem('planner.v2.perf') || '[]'); } catch (e) { list = []; }
  const groups = {};
  list.forEach((p) => { (groups[p.fn] = groups[p.fn] || []).push(p); });
  const avg = (a) => (a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null);
  const ms = (v) => (v === null ? '–' : v >= 1000 ? (v / 1000).toFixed(1) + '초' : v + 'ms');
  const rows = Object.keys(groups).map((fn) => {
    const g = groups[fn];
    return '<tr><td>' + esc(PERF_NAMES[fn] || fn) + '</td><td>' + g.length + '</td><td>' + ms(avg(g.map((x) => x.server).filter((x) => x !== null))) +
      '</td><td>' + ms(avg(g.map((x) => x.total))) + '</td></tr>';
  }).join('');
  openSheet('<h2>속도 기록 <button type="button" class="close" data-x>닫기</button></h2>' +
    '<p class="result">이 기기에서 최근 ' + list.length + '번 부른 기록이에요. 서버 = 구글 서버 처리 시간, 전체 = 누른 뒤 응답까지(네트워크 포함).</p>' +
    '<table class="perf"><tr><th>작업</th><th>횟수</th><th>서버</th><th>전체</th></tr>' + (rows || '<tr><td colspan="4">아직 기록이 없어요</td></tr>') + '</table>' +
    '<h3 style="margin-top:16px">시트 편집·자동 실행 (서버 기록)</h3><div id="perf-server" class="result">불러오는 중…</div>', (el) => {
    $('[data-x]', el).addEventListener('click', closeSheet);
    call('webGetPerf').then((sv) => {
      const g2 = {};
      (sv || []).forEach((p) => { (g2[p.name] = g2[p.name] || []).push(p.ms); });
      const box = $('#perf-server', el);
      if (!box) return;
      box.innerHTML = Object.keys(g2).length ? '<table class="perf"><tr><th>작업</th><th>횟수</th><th>평균</th></tr>' +
        Object.keys(g2).map((n) => '<tr><td>' + esc(PERF_NAMES[n] || ({ handleEdit: '시트 편집', syncCalendarHourly: '1시간 동기화', nightlyArchive: '밤 저장', midnightJob: '자정 작업' })[n] || n) +
          '</td><td>' + g2[n].length + '</td><td>' + ms(avg(g2[n])) + '</td></tr>').join('') + '</table>' : '아직 기록이 없어요';
    }).catch(() => { const box = $('#perf-server', el); if (box) box.textContent = '불러오지 못했어요'; });
  });
}

/** 뒤에서 저장: 실패하면 안내 + 서버 값으로 복구, 결과(또는 null) 반환 */
function save(fn, ...args) {
  S.pending++; showSaving();
  S.lastLocal = Date.now();
  return call(fn, ...args).then((r) => r).catch((err) => {
    notice('저장하지 못했어요 · ' + errText(err), true);
    reload(false);
    return null;
  }).finally(() => { S.pending--; S.lastLocal = Date.now(); showSaving(); });
}

function showSaving() { $('#saving').textContent = S.pending ? '저장 중…' : ''; }

let noticeTimer = null;
function notice(msg, isError) {
  const el = $('#notice');
  el.textContent = msg;
  el.className = 'notice' + (isError ? ' error' : '');
  el.hidden = false;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { el.hidden = true; }, 4000);
}

/** 전체 다시 불러오기 (refresh=true면 캘린더도 새로) */
function reload(refresh) {
  S.syncing++; showSyncing();
  const viewing = [S.dayKey && mondayKey(S.dayKey), S.weekKey].filter(Boolean);
  const before = JSON.stringify(viewing.map((k) => S.weeks[k] || null));
  return call(refresh ? 'webRefresh' : 'webBoot').then((b) => {
    S.lastLoad = Date.now();
    S.boot = b;
    applyWeek(b.week);
    store('boot', b);
    // 보고 있는 다른 주도 새로
    const others = viewing.filter((k) => k !== b.week.monday);
    return Promise.all(others.map((k) => call('webGetWeek', k).then(applyWeek))).then(() => {
      const after = JSON.stringify(viewing.map((k) => S.weeks[k] || null));
      if (after !== before) {
        // 이 기기에서 방금 저장한 게 아니면 다른 곳(시트 등)에서 바뀐 것
        if (before !== '[]' && before.indexOf('null') < 0 && Date.now() - S.lastLocal > 8000 && !refresh) notice('다른 곳에서 바뀌어서 새로 불러왔어요');
        if (!isEditing()) render();
      } else if (!isEditing() && !S.rendered) render();
      if (S.tab === 'month') loadMonth();
      return b;
    });
  }).catch((err) => {
    notice('불러오지 못했어요 · ' + errText(err), true);
  }).finally(() => { S.syncing--; showSyncing(); });
}

/** 새로고침 아이콘 돌리기 */
function showSyncing() { $('#refresh').classList.toggle('spin', S.syncing > 0); }

/** 마지막 데이터 저장·읽기 (localStorage, 실패해도 정상 동작) */
function store(name, value) { try { localStorage.setItem('planner.v2.' + name, JSON.stringify(value)); } catch (e) { /* 저장 공간 부족 등 */ } }
function restore(name) { try { const v = localStorage.getItem('planner.v2.' + name); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

/** 서버에서 받은 한 주를 반영 (+ 최근 6주만 기기에 저장) */
function applyWeek(week) {
  if (!week || !week.monday) return;
  S.weeks[week.monday] = week;
  const keys = Object.keys(S.weeks).sort().slice(-6);
  const keep = {};
  keys.forEach((k) => { keep[k] = S.weeks[k]; });
  store('weeks', keep);
}

/** 바뀐 하루만 받아 그 주에 끼워 넣기 */
function applyDay(day) {
  if (!day || !day.key) return;
  const w = S.weeks[mondayKey(day.key)];
  if (!w) return;
  const i = w.days.findIndex((d) => d.key === day.key);
  if (i >= 0) w.days[i] = day;
  applyWeek(w);
}

/** 꼭 끝낼 일·목표만 바뀐 경우 */
function applyWeekPart(part) {
  const w = part && S.weeks[part.monday];
  if (!w) return;
  if (part.must) w.must = part.must;
  if (part.info) w.info = part.info;
  applyWeek(w);
}

/** 앞뒤 주를 미리 받아 둠 (날짜 이동이 바로 되게) */
function prefetchAround(monKey) {
  if (!monKey) return;
  const base = parseKey(monKey);
  [-7, 7].forEach((n) => {
    const k = keyOf(addDays(base, n));
    if (S.weeks[k] || S.prefetching[k]) return;
    S.prefetching[k] = true;
    setTimeout(() => {
      call('webGetWeek', k).then((w) => { if (!S.weeks[k]) applyWeek(w); }).catch(() => {}).finally(() => { delete S.prefetching[k]; });
    }, 600);
  });
}

/** 그 주를 아직 안 받았으면 받아 오기 */
function ensureWeek(monKey) {
  if (S.weeks[monKey] || S.loadingWeek === monKey) return;
  S.loadingWeek = monKey;
  S.syncing++; showSyncing();
  call('webGetWeek', monKey).then((w) => { applyWeek(w); if (!isEditing()) render(); })
    .catch((err) => notice('불러오지 못했어요 · ' + errText(err), true))
    .finally(() => { S.loadingWeek = null; S.syncing--; showSyncing(); });
}

/* ---------- 아래에서 올라오는 입력창 ---------- */
function openSheet(html, mount) {
  $('#sheet').innerHTML = html;
  $('#sheet-bg').hidden = false;
  if (mount) mount($('#sheet'));
}
function closeSheet() {
  $('#sheet-bg').hidden = true;
  $('#sheet').innerHTML = '';
}

/* ---------- 공통 렌더 ---------- */
function render() {
  const inDetail = S.tab === 'week' && S.detail;
  $('#title').textContent = inDetail ? dayLabel(S.detail) : TITLES[S.tab];
  $('#back').hidden = !inDetail;
  $$('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab));
  if (!S.boot) return;
  S.rendered = true;
  if (!S.dayKey) S.dayKey = S.boot.todayKey;
  if (!S.weekKey) S.weekKey = mondayKey(S.boot.todayKey);
  if (S.tab === 'today') renderToday();
  else if (S.tab === 'week') (inDetail ? renderDetail() : renderWeek());
  else if (S.tab === 'month') renderMonth();
  else renderTimeline();
  const ed = $('.todo.editing textarea');
  if (ed) { ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); autoGrow(ed); }
}

function dayOf(key) {
  const w = S.weeks[mondayKey(key)];
  return w ? w.days.find((d) => d.key === key) : null;
}

function ring(pct) {
  const r = 30, c = 2 * Math.PI * r;
  return '<div class="ring"><svg viewBox="0 0 72 72" width="72" height="72">' +
    '<circle cx="36" cy="36" r="' + r + '" fill="none" stroke="#E3EDE8" stroke-width="7"/>' +
    '<circle cx="36" cy="36" r="' + r + '" fill="none" stroke="#2F5D50" stroke-width="7" stroke-linecap="round" ' +
    'stroke-dasharray="' + (c * pct / 100) + ' ' + c + '" transform="rotate(-90 36 36)"/></svg><span>' + pct + '%</span></div>';
}

function scheduleHtml(items, limit, clickable, dayKey) {
  if (!items.length) return '<ul class="sched"><li class="none">일정 없음</li></ul>';
  const list = limit && items.length > limit ? items.slice(0, limit - 1) : items;
  return '<ul class="sched' + (clickable ? ' tap' : '') + '">' + list.map((s, i) => {
    const label = (s.kind === 'tt' ? '📚 ' : '') + esc(s.text) + noteIcon(s.memo);
    const check = clickable && !s.pending ? '<button type="button" class="check s-check' + (s.done ? ' on' : '') + '" data-n="' + i + '" aria-label="일정 완료"></button>' : '';
    const body = clickable && s.kind !== 'tt' && !s.pending
      ? '<button type="button" class="sched-item" data-n="' + i + '">' + label + '</button>'
      : '<span class="sched-ro">' + label + '</span>';
    return '<li class="' + (s.done ? 'done ' : '') + (s.kind === 'tt' ? 'tt ' : '') + (s.pending ? 'pending' : '') + '">' + check + body + '</li>';
  }).join('') + (list.length < items.length ? '<li class="memo">+' + (items.length - list.length) + '개 더</li>' : '') + '</ul>';
}

/** 일정 완료 개수 "2/3" */
function schedCount(items) {
  return items.length ? items.filter((i) => i.done).length + '/' + items.length : '';
}

/* ---------- 할 일 목록 ---------- */
/**
 * full: 체크·누르면 편집(시간·내용·삭제)·추가 / compact(위클리 카드): 보기 + 체크, 누르면 요일 상세
 */
function todosHtml(day, compact) {
  const editing = S.edit && S.edit.key === day.key ? S.edit.i : -1;
  let html = day.todos.map((r, i) => (i === editing ? editorHtml(r) : todoRowHtml(r, i))).join('');
  if (editing >= day.todos.length) html += editorHtml([false, '', '', '', '']); // 새 할 일
  else html += '<button type="button" class="add-todo">할 일 추가</button>'; // 개수 제한 없음
  return '<div class="todos' + (compact ? ' compact' : '') + '" data-key="' + day.key + '">' + html + '</div>';
}

function todoRowHtml(r, i) {
  const cls = r[0] ? 'done' : r[4] === FLAG.MISSED ? 'missed' : '';
  const mark = r[4] === FLAG.MISSED ? '미완 → ' : r[4] === FLAG.CARRIED ? '↪ ' : '';
  return '<div class="todo ' + cls + '" data-i="' + i + '">' +
    '<button type="button" class="check' + (r[0] ? ' on' : '') + '" aria-label="완료"></button>' +
    '<div class="body" role="button" tabindex="0">' + (r[1] ? '<span class="tag">' + esc(timeTag(r[1])) + '</span>' : '') +
    '<span class="txt">' + esc(mark + r[2]) + '</span>' + noteIcon(r[3]) + '</div></div>';
}

function editorHtml(r) {
  const range = normRange(r[1]);
  const st = range.slice(0, 5), en = range.slice(6, 11);
  return '<div class="todo editing">' +
    '<textarea rows="1" class="t-text" placeholder="할 일 (예: 11-13 점심 약속)" enterkeyhint="done">' + esc(r[2]) + '</textarea>' +
    '<div class="ed-row"><label>시작 <input type="time" class="t-start" value="' + st + '"></label>' +
    '<label>끝 <input type="time" class="t-end" value="' + en + '"></label></div>' +
    '<textarea rows="2" class="t-memo" placeholder="메모 (선택 · 목록에는 아이콘만 보여요)">' + esc(r[3] || '') + '</textarea>' +
    '<div class="ed-row"><span class="grow"></span>' +
    (r[2] ? '<button type="button" class="btn-ghost btn-danger" data-act="del">삭제</button>' : '') +
    '<button type="button" class="btn-ghost" data-act="cancel">취소</button>' +
    '<button type="button" class="btn-sm" data-act="ok">완료</button></div></div>';
}

function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

/** 할 일 목록 이벤트 연결 */
function bindTodos(root) {
  $$('.todos', root).forEach((list) => {
    const day = dayOf(list.dataset.key);
    if (!day) return;
    const compact = list.classList.contains('compact');
    list.addEventListener('click', (e) => {
      const check = e.target.closest('button.check');
      if (check && check.closest('.todo:not(.editing)')) {
        e.stopPropagation();
        const i = +check.closest('.todo').dataset.i;
        day.todos[i][0] = !day.todos[i][0];
        return commitTodos(day);
      }
      if (compact) return; // 카드 자체 클릭 → 요일 상세 (renderWeek에서 처리)
      if (e.target.closest('.add-todo')) { S.edit = { key: day.key, i: day.todos.length }; return render(); }
      const body = e.target.closest('.body');
      if (body) { S.edit = { key: day.key, i: +body.closest('.todo').dataset.i }; return render(); }
      const act = e.target.closest('[data-act]');
      if (act) finishEdit(day, act.dataset.act);
    });
    if (compact) return;
    list.addEventListener('keydown', (e) => {
      if (e.target.classList.contains('t-text') && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); finishEdit(day, 'ok'); }
      if (e.key === 'Escape') finishEdit(day, 'cancel');
      if (e.target.classList.contains('body') && e.key === 'Enter') e.target.click();
    });
    list.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') autoGrow(e.target); });
  });
}

/** 편집 끝내기: ok(저장) / del(삭제) / cancel */
function finishEdit(day, act) {
  const ed = $('.todos[data-key="' + day.key + '"] .todo.editing');
  const i = S.edit ? S.edit.i : -1;
  const isNew = i >= day.todos.length;
  S.edit = null;
  if (!ed || i < 0 || act === 'cancel') return render();
  if (act === 'del') {
    if (!isNew) day.todos.splice(i, 1); // 할 일과 메모 함께 삭제
  } else {
    let text = $('.t-text', ed).value.replace(/\s*\n\s*/g, ' ').trim();
    const memo = $('.t-memo', ed).value.replace(/\s+$/, '');
    const st = normTime($('.t-start', ed).value), en = normTime($('.t-end', ed).value);
    let time = st ? (en && en > st ? st + '-' + en : st) : '';
    if (!time) { const split = splitTimeFromText(text); if (split) { time = split.time; text = split.text; } } // '11-13 회의'
    if (isNew) { if (text) day.todos.push([false, time, text, memo, '']); }
    else if (text) day.todos[i] = [day.todos[i][0], time, text, memo, day.todos[i][4] || ''];
    else day.todos.splice(i, 1);
  }
  commitTodos(day);
  if (isNew && act === 'ok') { S.edit = { key: day.key, i: day.todos.length }; render(); } // 이어서 다음 할 일
}

/** 정렬해서 화면 반영 → 뒤에서 저장 → 서버 결과와 다르면 맞춤 */
function commitTodos(day) {
  day.todos = sortTodos(day.todos);
  render();
  save('webSetTodos', day.key, day.todos, day.rev).then((res) => {
    if (!res) return;
    applyDay(res.day);
    if (res.conflict) notice('다른 곳에서 바뀌어서 새로 불러왔어요');
    if (!isEditing()) render();
  });
}

/* ---------- 하루 화면 (오늘 탭 · 위클리 요일 상세 공용) ---------- */
function dayViewHtml(day, isToday) {
  const b = S.boot, t = todoRate(day.todos);
  const habits = b.habits.map((name, i) => (name ? { name, i } : null)).filter(Boolean);
  const red = isRedDay(day.key, day.holiday);
  return '<section class="hero"><div><div class="date' + (red ? ' red' : '') + '">' + dayLabel(day.key) + '</div>' +
      (day.holiday ? '<div class="holiday">' + esc(day.holiday) + '</div>' : '') +
      '<div class="sub">할 일 ' + t.done + ' / ' + t.total + ' 완료</div></div>' + ring(t.pct) + '</section>' +
    '<div class="grid-2"><div>' +
      '<div class="card"><h3><span>' + (isToday ? '오늘 일정' : '일정') + ' <small>' + schedCount(day.schedule) + '</small></span>' +
        '<button type="button" class="link-btn" id="add-item">+ 일정</button></h3>' + scheduleHtml(day.schedule, 0, true, day.key) + '</div>' +
      '<div class="card"><h3>할 일 <small>누르면 시간·내용 수정</small></h3>' + todosHtml(day) + '</div>' +
    '</div><div>' +
      '<div class="card"><h3><span>습관 <small>' + habits.filter((h) => day.habits[h.i]).length + ' / ' + habits.length + '</small></span>' +
        '<button type="button" class="link-btn" id="habit-edit">편집</button></h3><div class="habits">' +
        habits.map((h) => '<button type="button" class="habit' + (day.habits[h.i] ? ' on' : '') + '" data-i="' + h.i + '">' +
          '<span class="dot">' + (day.habits[h.i] ? '✓' : esc(h.name.slice(0, 2))) + '</span><span class="name">' + esc(h.name) + '</span></button>').join('') +
        (habits.length ? '' : '<p class="result">편집을 눌러 습관을 추가해 보세요</p>') +
      '</div></div>' +
      '<div class="card"><h3>기분</h3><div class="moods">' +
        b.moods.map((m, i) => '<button type="button" class="mood' + (day.mood.score === i + 1 ? ' on' : '') + '" data-s="' + (i + 1) + '" aria-label="' + (i + 1) + '점">' + m + '</button>').join('') +
      '</div><input class="field" id="mood-memo" placeholder="한 줄 메모" value="' + esc(day.mood.memo) + '"></div>' +
    '</div></div>';
}

function bindDayView(day) {
  bindTodos($('#view'));
  $$('.habit').forEach((el) => el.addEventListener('click', () => {
    const i = +el.dataset.i;
    day.habits[i] = !day.habits[i];
    render();
    save('webSetHabit', day.key, S.boot.habits[i], day.habits[i]).then((res) => { if (res) applyDay(res.day); });
  }));
  $('#habit-edit').addEventListener('click', openHabitEditor);
  $$('.mood').forEach((el) => el.addEventListener('click', () => {
    const s = +el.dataset.s;
    day.mood.score = day.mood.score === s ? '' : s;
    render();
    save('webSetMood', day.key, day.mood.score, day.mood.memo);
  }));
  $('#mood-memo').addEventListener('change', (e) => {
    day.mood.memo = e.target.value.trim();
    save('webSetMood', day.key, day.mood.score, day.mood.memo);
  });
  // 일정: "+ 일정"은 새로, 목록의 일정을 누르면 수정·삭제 (먼슬리와 같은 입력창)
  $('#add-item').addEventListener('click', () => openItemSheet(day.key, day.schedule, null));
  $$('.sched-item').forEach((el) => el.addEventListener('click', () => openItemSheet(day.key, day.schedule, day.schedule[+el.dataset.n])));
  // 일정 완료 체크 (구글 캘린더 일정은 그대로, 체크된 일정은 아래로)
  $$('.s-check').forEach((el) => el.addEventListener('click', () => {
    const it = day.schedule[+el.dataset.n];
    it.done = !it.done;
    day.schedule = day.schedule.filter((x) => !x.done).concat(day.schedule.filter((x) => x.done));
    render();
    save('webCheckItem', day.key, it.key, it.done).then((res) => { if (res) { applyDay(res.day); if (!isEditing()) render(); } });
  }));
}

function renderToday() {
  const key = S.dayKey;
  const day = dayOf(key);
  const nav = dayNavHtml(key);
  if (!day) { $('#view').innerHTML = nav + '<p class="empty">불러오는 중…</p>'; bindDayNav(); ensureWeek(mondayKey(key)); return; }
  $('#view').innerHTML = nav + dupNoticeHtml() + dayViewHtml(day, key === S.boot.todayKey) +
    '<p class="perf-link"><button type="button" class="link-btn" id="perf-open">⚡ 속도 기록</button></p>';
  bindDayNav();
  $('#perf-open').addEventListener('click', openPerf);
  prefetchAround(mondayKey(key));
  bindDupNotice();
  bindDayView(day);
}

/** 오늘 탭 날짜 이동 줄: ‹ 날짜(누르면 달력) › + 오늘로 */
function dayNavHtml(key) {
  const today = S.boot.todayKey;
  return '<div class="date-nav"><button type="button" class="icon-btn" id="d-prev" aria-label="전날">‹</button>' +
    '<button type="button" class="date-title" id="d-pick">' + shortDayLabel(key) + ' ▾</button>' +
    '<button type="button" class="icon-btn" id="d-next" aria-label="다음 날">›</button>' +
    (key !== today ? '<button type="button" class="chip-btn" id="d-today">오늘로</button>' : '') + '</div>';
}

/** '오늘 · 11/11 (수)', '어제 · …', '내일 · …', 그 밖엔 '11/11 (수)' */
function shortDayLabel(key) {
  const d = parseKey(key), diff = Math.round((d - parseKey(S.boot.todayKey)) / 86400000);
  const rel = { '-2': '엊그제', '-1': '어제', 0: '오늘', 1: '내일', 2: '모레' }[diff];
  return (rel ? rel + ' · ' : '') + (d.getMonth() + 1) + '/' + d.getDate() + ' (' + WEEKDAYS[(d.getDay() + 6) % 7] + ')';
}

function moveDay(n) {
  S.edit = null;
  S.dayKey = keyOf(addDays(parseKey(S.dayKey), n));
  render();
}

function bindDayNav() {
  $('#d-prev').addEventListener('click', () => moveDay(-1));
  $('#d-next').addEventListener('click', () => moveDay(1));
  const t = $('#d-today');
  if (t) t.addEventListener('click', () => { S.dayKey = S.boot.todayKey; S.edit = null; render(); });
  $('#d-pick').addEventListener('click', () => openDatePicker('day', S.dayKey));
}

function renderDetail() {
  const day = dayOf(S.detail);
  if (!day) { S.detail = null; return renderWeek(); }
  $('#view').innerHTML = dayViewHtml(day, day.key === S.boot.todayKey);
  bindDayView(day);
}


/* ---------- 요일 상세 열기·닫기 (뒤로가기 지원) ---------- */
const hist = (window.google && google.script && google.script.history) || null;

function openDetail(key) {
  S.detail = key; S.edit = null;
  if (hist) hist.push({ detail: key }, {}, 'day-' + key);
  render();
  window.scrollTo(0, 0);
}

function closeDetail() {
  S.detail = null; S.edit = null;
  render();
}

if (hist) {
  hist.setChangeHandler((e) => {
    const key = e.state && e.state.detail;
    if (key && S.tab === 'week') { S.detail = key; } else { S.detail = null; }
    S.edit = null;
    render();
  });
}

/* ---------- 위클리 ---------- */
function renderWeek() {
  const w = S.weeks[S.weekKey];
  if (!w) { $('#view').innerHTML = weekNavHtml(S.weekKey) + '<p class="empty">불러오는 중…</p>'; bindWeekNav(); ensureWeek(S.weekKey); return; }
  const mon = parseKey(w.monday), sun = addDays(mon, 6);
  const habits = S.boot.habits.map((name, i) => (name ? { name, i } : null)).filter(Boolean);
  const labels = ['이번 주 목표', '보상', '확언'];

  $('#view').innerHTML =
    weekNavHtml(S.weekKey) +
    '<div class="grid-2"><div class="card"><h3>이번 주</h3><div class="form">' +
      w.info.map((v, i) => '<label class="wide">' + labels[i] + '<input class="field info" data-i="' + i + '" value="' + esc(v) + '"></label>').join('') +
    '</div></div><div class="card"><h3>꼭 끝낼 일 <small>' + w.must.filter((r) => r[0]).length + ' / ' + w.must.length + '</small></h3>' +
      w.must.map((r, i) => '<div class="row-check' + (r[0] ? ' done' : '') + '" data-i="' + i + '">' +
        '<button type="button" class="check' + (r[0] ? ' on' : '') + '" aria-label="완료"></button>' +
        '<input class="must" value="' + esc(r[1]) + '" placeholder="꼭 끝낼 일"></div>').join('') +
      '<div class="row-check add-must"><span class="check ghost"></span><input class="must-new" placeholder="+ 꼭 끝낼 일 추가" enterkeyhint="done"></div>' +
    '</div></div>' +
    '<div class="week-tools"><button type="button" class="chip-btn" id="tt-edit">📚 시간표 편집</button>' +
      '<button type="button" class="chip-btn' + (S.weekGrid ? ' on' : '') + '" id="grid-toggle">' + (S.weekGrid ? '가로 스크롤 보기' : '7칸 한 줄 보기') + '</button></div>' +
    '<div class="days' + (S.weekGrid ? ' grid7' : '') + '" id="days">' + w.days.map((day, d) => {
      const date = parseKey(day.key), t = todoRate(day.todos);
      const mood = day.mood.score ? S.boot.moods[day.mood.score - 1] + ' ' : '';
      return '<div class="card day' + (day.key === S.boot.todayKey ? ' today' : '') + '" data-key="' + day.key + '">' +
        '<div class="day-head"><b class="' + (isRedDay(day.key, day.holiday) ? 'red' : '') + '">' + WEEKDAYS[d] + ' ' + (date.getMonth() + 1) + '/' + date.getDate() + '</b><span>' + t.pct + '%</span></div>' +
        (day.holiday ? '<div class="holiday">' + esc(day.holiday) + '</div>' : '') +
        (day.schedule.length ? '<div class="sched-count">일정 ' + schedCount(day.schedule) + '</div>' : '') +
        scheduleHtml(day.schedule, 3) + todosHtml(day, true) +
        (mood || day.mood.memo ? '<div class="mood-line">' + mood + esc(day.mood.memo) + '</div>' : '') + '</div>';
    }).join('') + '</div>' +
    '<div class="card" style="margin-top:12px"><h3><span>습관</span><button type="button" class="link-btn" id="habit-edit">편집</button></h3>' +
      '<div class="scroll-x"><table class="habit-table"><tr><th></th>' +
      WEEKDAYS.map((n) => '<th>' + n + '</th>').join('') + '<th>%</th></tr>' +
      habits.map((h) => {
        const n = w.days.filter((day) => day.habits[h.i]).length;
        return '<tr><td>' + esc(h.name) + '</td>' + w.days.map((day, d) =>
          '<td><button type="button" class="hcell' + (day.habits[h.i] ? ' on' : '') + '" data-h="' + h.i + '" data-d="' + d + '" aria-label="' + esc(h.name) + ' ' + WEEKDAYS[d] + '"></button></td>').join('') +
          '<td style="color:#999">' + Math.round((n / 7) * 100) + '%</td></tr>';
      }).join('') + '</table></div></div>';

  bindTodos($('#view'));
  // 요일 카드 누르면 상세 화면 (체크 버튼은 제외)
  $$('.day').forEach((card) => card.addEventListener('click', (e) => {
    if (e.target.closest('button.check')) return;
    openDetail(card.dataset.key);
  }));
  $('#grid-toggle').addEventListener('click', () => {
    S.weekGrid = !S.weekGrid;
    writePref('weekGrid', S.weekGrid ? '1' : '');
    render();
  });
  $('#tt-edit').addEventListener('click', openTimetableEditor);
  $('#habit-edit').addEventListener('click', openHabitEditor);
  bindWeekNav();
  prefetchAround(S.weekKey);
  const saveWeek = (fn, arg) => save(fn, w.monday, arg).then((res) => { if (res) { applyWeekPart(res.weekPart); if (!isEditing()) render(); } });
  $$('.info').forEach((el) => el.addEventListener('change', () => {
    w.info[+el.dataset.i] = el.value.trim();
    saveWeek('webSetWeekInfo', w.info);
  }));
  // 꼭 끝낼 일: 개수 제한 없음, 내용을 지우면 삭제
  $$('.row-check[data-i]').forEach((row) => {
    const i = +row.dataset.i;
    $('button', row).addEventListener('click', () => { w.must[i][0] = !w.must[i][0]; render(); saveWeek('webSetMust', w.must); });
    $('input', row).addEventListener('change', (e) => {
      const v = e.target.value.trim();
      if (v) w.must[i][1] = v; else w.must.splice(i, 1);
      saveWeek('webSetMust', w.must);
      if (!v) render();
    });
  });
  const addMust = $('.must-new');
  addMust.addEventListener('change', () => {
    const v = addMust.value.trim();
    if (!v) return;
    w.must.push([false, v]);
    render();
    saveWeek('webSetMust', w.must);
    const next = $('.must-new');
    if (next) next.focus();
  });
  addMust.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) addMust.blur(); });
  $$('.hcell').forEach((el) => el.addEventListener('click', () => {
    const day = w.days[+el.dataset.d], i = +el.dataset.h;
    day.habits[i] = !day.habits[i];
    render();
    save('webSetHabit', day.key, S.boot.habits[i], day.habits[i]).then((res) => { if (res) applyDay(res.day); });
  }));
  // 가로 스크롤이면 오늘 카드가 보이게
  const today = $('.day.today'), days = $('#days');
  if (today && !S.weekGrid && days.scrollWidth > days.clientWidth) days.scrollLeft = today.offsetLeft - 16;
}

/** 위클리 주 이동 줄: ‹ 기간(누르면 달력) › + 이번 주로 */
function weekNavHtml(monKey) {
  const mon = parseKey(monKey), sun = addDays(mon, 6);
  const label = (mon.getMonth() + 1) + '월 ' + mon.getDate() + '일 – ' + (sun.getMonth() !== mon.getMonth() ? (sun.getMonth() + 1) + '월 ' : '') + sun.getDate() + '일';
  return '<div class="date-nav"><button type="button" class="icon-btn" id="w-prev" aria-label="지난주">‹</button>' +
    '<button type="button" class="date-title" id="w-pick">' + label + '</button>' +
    '<button type="button" class="icon-btn" id="w-next" aria-label="다음 주">›</button>' +
    (monKey !== mondayKey(S.boot.todayKey) ? '<button type="button" class="chip-btn" id="w-this">이번 주로</button>' : '') + '</div>';
}

function bindWeekNav() {
  const move = (n) => { S.weekKey = keyOf(addDays(parseKey(S.weekKey), 7 * n)); S.detail = null; render(); };
  $('#w-prev').addEventListener('click', () => move(-1));
  $('#w-next').addEventListener('click', () => move(1));
  const t = $('#w-this');
  if (t) t.addEventListener('click', () => { S.weekKey = mondayKey(S.boot.todayKey); render(); });
  $('#w-pick').addEventListener('click', () => openDatePicker('week', S.weekKey));
}

/* ---------- 달력에서 날짜·주 고르기 ---------- */
function openDatePicker(mode, currentKey) {
  let view = parseKey(currentKey);
  view = new Date(view.getFullYear(), view.getMonth(), 1);
  const draw = () => {
    const y = view.getFullYear(), m = view.getMonth();
    const offset = (view.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
    const selMon = mondayKey(currentKey);
    let cells = WEEKDAYS.map((n) => '<div class="wd">' + n + '</div>').join('');
    for (let i = 0; i < offset; i++) cells += '<div></div>';
    for (let n = 1; n <= days; n++) {
      const k = keyOf(new Date(y, m, n));
      const sel = mode === 'day' ? k === currentKey : mondayKey(k) === selMon;
      cells += '<button type="button" class="pick' + (sel ? ' sel' : '') + (k === S.boot.todayKey ? ' today' : '') + (new Date(y, m, n).getDay() === 0 ? ' red' : '') + '" data-k="' + k + '">' + n + '</button>';
    }
    openSheet('<h2>' + (mode === 'day' ? '날짜로 이동' : '주로 이동') + ' <button type="button" class="close" data-x>닫기</button></h2>' +
      '<div class="month-nav"><button type="button" class="icon-btn" data-m="-1">‹</button><b>' + y + '년 ' + (m + 1) + '월</b>' +
      '<button type="button" class="icon-btn" data-m="1">›</button></div><div class="picker">' + cells + '</div>' +
      '<div class="sheet-actions"><button type="button" class="btn" data-k="' + S.boot.todayKey + '">' + (mode === 'day' ? '오늘로' : '이번 주로') + '</button></div>', (el) => {
      $('[data-x]', el).addEventListener('click', closeSheet);
      $$('[data-m]', el).forEach((b) => b.addEventListener('click', () => { view = new Date(y, m + +b.dataset.m, 1); draw(); }));
      $$('[data-k]', el).forEach((b) => b.addEventListener('click', () => {
        if (mode === 'day') S.dayKey = b.dataset.k; else { S.weekKey = mondayKey(b.dataset.k); S.detail = null; }
        S.edit = null;
        closeSheet();
        render();
      }));
    });
  };
  draw();
}

/* ---------- 이미 생긴 중복 일정 정리 ---------- */
function dupNoticeHtml() {
  const n = S.boot.duplicates || 0;
  return n ? '<div class="card dup-card"><span>중복된 일정이 ' + n + '건 있어요</span><button type="button" class="chip-btn" id="dup-open">확인하기</button></div>' : '';
}

function bindDupNotice() {
  const b = $('#dup-open');
  if (b) b.addEventListener('click', openDuplicates);
}

/** 지우기 전에 목록부터 보여 주고, 확인하면 하나만 남김 */
function openDuplicates() {
  openSheet('<h2>중복 일정 <button type="button" class="close" data-x>닫기</button></h2><p class="empty">찾는 중…</p>', (el) => {
    $('[data-x]', el).addEventListener('click', closeSheet);
  });
  call('webFindDuplicates').then((list) => {
    openSheet('<h2>중복 일정 <button type="button" class="close" data-x>닫기</button></h2>' +
      (list.length ? '<p class="result">아래 일정은 같은 것이 여러 개예요. 정리하면 각각 하나만 남겨요.</p><ul class="item-list">' +
        list.map((g) => '<li><div class="ro">' + esc(g.date.slice(5).replace('-', '/')) + ' · ' + esc(g.text) +
          ' <span class="badge">' + (g.kind === 'calendar' ? '구글 캘린더 ' : '먼슬리 메모 ') + g.count + '개 → 1개</span></div></li>').join('') + '</ul>' +
        '<div class="result" id="dup-msg"></div><div class="sheet-actions"><button type="button" class="btn" id="dup-go">하나만 남기기</button></div>'
        : '<p class="empty">중복된 일정이 없어요</p>'), (el) => {
      $('[data-x]', el).addEventListener('click', closeSheet);
      const go = $('#dup-go', el);
      if (go) go.addEventListener('click', () => {
        go.disabled = true;
        $('#dup-msg', el).textContent = '정리 중…';
        call('webCleanDuplicates', list.length).then((r) => {
          closeSheet();
          notice('중복 ' + r.removed + '개를 정리했어요');
          S.weeks = {};
          reload(false);
        }).catch((err) => { $('#dup-msg', el).textContent = '오류: ' + errText(err); go.disabled = false; });
      });
    });
  }).catch((err) => notice('불러오지 못했어요 · ' + errText(err), true));
}

/* ---------- 시간표 편집 ---------- */
function openTimetableEditor() {
  const tt = JSON.parse(JSON.stringify(S.boot.timetable || { start: '', end: '', rows: [] }));
  const draw = () => {
    openSheet('<h2>고정 시간표 <button type="button" class="close" data-x>닫기</button></h2>' +
      '<div class="form" style="margin-bottom:14px"><label>학기 시작<input class="field" type="date" id="tt-start" value="' + tt.start + '"></label>' +
      '<label>학기 종료<input class="field" type="date" id="tt-end" value="' + tt.end + '"></label></div>' +
      '<p class="result" style="margin:0 0 10px">학기 기간에만 매주 위클리·오늘 "일정"에 표시돼요 (할 일 10줄은 차지하지 않아요)</p>' +
      tt.rows.map((r, i) => '<div class="tt-day" data-i="' + i + '"><div class="tt-row">' +
        '<select class="field" data-f="day">' + WEEKDAYS.map((n, d) => '<option value="' + d + '"' + (r.day === d ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>' +
        '<input class="field" type="time" data-f="start" value="' + esc(r.start) + '">' +
        '<input class="field" type="time" data-f="end" value="' + esc(r.end) + '">' +
        '<button type="button" class="mini" data-del aria-label="삭제">✕</button>' +
        '<input class="field name" data-f="name" placeholder="이름 (예: 데이터마이닝)" value="' + esc(r.name) + '"></div></div>').join('') +
      '<button type="button" class="add-todo" id="tt-add">수업 추가</button>' +
      '<div class="result" id="tt-msg"></div>' +
      '<div class="sheet-actions"><button type="button" class="btn" id="tt-save">저장</button></div>', (el) => {
      const sync = () => {
        tt.start = $('#tt-start', el).value; tt.end = $('#tt-end', el).value;
        $$('.tt-day', el).forEach((row) => {
          const r = tt.rows[+row.dataset.i];
          $$('[data-f]', row).forEach((inp) => { r[inp.dataset.f] = inp.dataset.f === 'day' ? +inp.value : inp.value.trim(); });
        });
      };
      $('[data-x]', el).addEventListener('click', closeSheet);
      $('#tt-add', el).addEventListener('click', () => { sync(); tt.rows.push({ day: 0, start: '', end: '', name: '' }); draw(); });
      $$('[data-del]', el).forEach((b) => b.addEventListener('click', () => { sync(); tt.rows.splice(+b.closest('.tt-day').dataset.i, 1); draw(); }));
      $('#tt-save', el).addEventListener('click', () => {
        sync();
        $('#tt-msg', el).textContent = '저장 중…';
        call('webSetTimetable', tt, S.weekKey).then((res) => {
          S.boot.timetable = res.timetable;
          S.weeks = {}; // 모든 주의 일정이 바뀜 → 다시 받기
          applyWeek(res.week);
          closeSheet(); render(); notice('시간표를 저장했어요 ✓');
        }).catch((err) => { $('#tt-msg', el).textContent = '오류: ' + errText(err); });
      });
    });
  };
  draw();
}

/* ---------- 습관 편집 ---------- */
function openHabitEditor() {
  // from = 원래 순서 번호 (위클리 체크를 따라 옮기기 위해), 새 습관은 null
  const list = S.boot.habits.map((name, i) => ({ name, from: i })).filter((h) => h.name);
  const draw = () => {
    openSheet('<h2>습관 편집 <button type="button" class="close" data-x>닫기</button></h2>' +
      list.map((h, i) => '<div class="edit-row" data-i="' + i + '">' +
        '<input class="field" value="' + esc(h.name) + '" placeholder="습관 이름">' +
        '<button type="button" class="mini" data-up' + (i === 0 ? ' disabled' : '') + ' aria-label="위로">↑</button>' +
        '<button type="button" class="mini" data-down' + (i === list.length - 1 ? ' disabled' : '') + ' aria-label="아래로">↓</button>' +
        '<button type="button" class="mini" data-del aria-label="삭제">✕</button></div>').join('') +
      (list.length < HABIT_MAX ? '<button type="button" class="add-todo" id="h-add">습관 추가 (' + list.length + ' / ' + HABIT_MAX + ')</button>' : '<p class="result">최대 ' + HABIT_MAX + '개예요</p>') +
      '<p class="result">이름을 바꾸거나 지워도 기록 시트의 예전 기록은 그대로 남아요</p>' +
      '<div class="result" id="h-msg"></div>' +
      '<div class="sheet-actions"><button type="button" class="btn" id="h-save">저장</button></div>', (el) => {
      const sync = () => $$('.edit-row', el).forEach((row) => { list[+row.dataset.i].name = $('input', row).value.trim(); });
      const move = (i, to) => { sync(); const [h] = list.splice(i, 1); list.splice(to, 0, h); draw(); };
      $('[data-x]', el).addEventListener('click', closeSheet);
      $$('.edit-row', el).forEach((row) => {
        const i = +row.dataset.i;
        $('[data-up]', row).addEventListener('click', () => move(i, i - 1));
        $('[data-down]', row).addEventListener('click', () => move(i, i + 1));
        $('[data-del]', row).addEventListener('click', () => { sync(); list.splice(i, 1); draw(); });
      });
      const add = $('#h-add', el);
      if (add) add.addEventListener('click', () => { sync(); list.push({ name: '', from: null }); draw(); const ins = $$('.edit-row input', $('#sheet')); ins[ins.length - 1].focus(); });
      $('#h-save', el).addEventListener('click', () => {
        sync();
        $('#h-msg', el).textContent = '저장 중…';
        call('webSetHabits', list.filter((h) => h.name)).then((b) => {
          S.boot = b; S.weeks = {}; applyWeek(b.week); store('boot', b); closeSheet(); render(); notice('습관을 저장했어요 ✓');
        }).catch((err) => { $('#h-msg', el).textContent = '오류: ' + errText(err); });
      });
    });
  };
  draw();
}

/* ---------- 먼슬리 ---------- */
function loadMonth() {
  if (!S.ym) { const t = parseKey(S.boot.todayKey); S.ym = { y: t.getFullYear(), m: t.getMonth() + 1 }; }
  const want = S.ym.y + '-' + S.ym.m;
  if (!S.month || S.month.y + '-' + S.month.m !== want) {
    const saved = restore('month.' + want); // 저장해 둔 달 먼저 보여주기
    if (saved) { S.month = saved; if (S.tab === 'month' && !isEditing()) render(); }
  }
  S.syncing++; showSyncing();
  return call('webGetMonth', S.ym.y, S.ym.m).then((data) => {
    store('month.' + data.y + '-' + data.m, data);
    if (want !== S.ym.y + '-' + S.ym.m) return; // 그사이 다른 달로 넘김
    const changed = JSON.stringify(data) !== JSON.stringify(S.month);
    S.month = data;
    if (changed && S.tab === 'month' && !isEditing()) render();
  }).catch((err) => notice('먼슬리를 불러오지 못했어요 · ' + errText(err), true))
    .finally(() => { S.syncing--; showSyncing(); });
}

function renderMonth() {
  if (!S.ym) { const t = parseKey(S.boot.todayKey); S.ym = { y: t.getFullYear(), m: t.getMonth() + 1 }; }
  const M = S.month;
  if (!M || M.y !== S.ym.y || M.m !== S.ym.m) {
    $('#view').innerHTML = monthNavHtml() + '<p class="empty">불러오는 중…</p>';
    bindMonthNav();
    return;
  }
  let cells = WEEKDAYS.map((n) => '<div class="wd">' + n + '</div>').join('');
  for (let i = 0; i < M.offset; i++) cells += '<div class="cell blank"></div>';
  M.dates.forEach((c) => {
    const key = M.y + '-' + pad(M.m) + '-' + pad(c.day);
    const shown = c.items.length > 2 ? c.items.slice(0, 1) : c.items; // 넘치면 1개 + "+N"
    cells += '<button type="button" class="cell' + (key === M.todayKey ? ' today' : '') + (S.selDay === c.day ? ' sel' : '') + '" data-day="' + c.day + '">' +
      '<span class="num' + (isRedDay(key, c.holiday) ? ' red' : '') + '">' + c.day + (c.mood ? '<i class="mdot" style="background:' + MOOD_COLORS[c.mood] + '"></i>' : '') + '</span>' +
      (c.holiday ? '<span class="holiday">' + esc(c.holiday) + '</span>' : '') +
      shown.map((it) => '<span class="ev ' + it.kind + '">' + esc(it.title || it.text) + noteIcon(it.memo) + '</span>').join('') +
      (c.items.length > shown.length ? '<span class="more">+' + (c.items.length - shown.length) + '</span>' : '') +
      '</button>';
  });

  $('#view').innerHTML = monthNavHtml() +
    '<div class="card"><div class="cal">' + cells + '</div><p class="result" style="margin:10px 0 0">날짜를 누르면 일정을 추가·수정할 수 있어요</p></div>' +
    '<div class="grid-2"><div>' +
      '<div class="card"><h3>이번 달 목표</h3>' + M.goals.map((r, i) => '<div class="row-check' + (r[0] ? ' done' : '') + '" data-i="' + i + '">' +
        '<button type="button" class="check' + (r[0] ? ' on' : '') + '" aria-label="완료"></button>' +
        '<input value="' + esc(r[1]) + '" placeholder="목표 ' + (i + 1) + '"></div>').join('') + '</div>' +
      '<div class="card"><h3>습관 달성률 <small>' + M.elapsed + '일 기준</small></h3>' +
        (M.habits.length ? M.habits.map((h) => '<div class="rate-row"><span>' + esc(h.name) + '</span><div class="bar"><i style="width:' +
          Math.round(h.rate * 100) + '%"></i></div><span>' + Math.round(h.rate * 100) + '%</span></div>').join('') : '<p class="result">습관을 추가해 주세요</p>') +
      '</div></div><div>' +
      '<div class="card"><h3>기분 그래프</h3>' + moodChart(M) + '</div>' +
    '</div></div>';

  bindMonthNav();
  $$('.cal .cell[data-day]').forEach((el) => el.addEventListener('click', () => {
    S.selDay = +el.dataset.day;
    render();
    const c = M.dates[S.selDay - 1];
    openItemSheet(M.y + '-' + pad(M.m) + '-' + pad(c.day), c.items, null, { y: M.y, m: M.m });
  }));
  $$('.row-check').forEach((row) => {
    const i = +row.dataset.i;
    $('button', row).addEventListener('click', () => { M.goals[i][0] = !M.goals[i][0]; render(); save('webSetMonthGoals', M.y, M.m, M.goals); });
    $('input', row).addEventListener('change', (e) => { M.goals[i][1] = e.target.value.trim(); save('webSetMonthGoals', M.y, M.m, M.goals); });
  });
}

/**
 * 일정 입력창 (오늘·요일 상세·먼슬리 공용)
 * 위에는 그날 일정 목록(누르면 수정), 아래는 제목 / 시작(선택) / 끝(선택) 폼. 저장하면 항상 구글 캘린더에도 저장
 * edit = 수정할 일정 (새로 추가면 null), ym = 먼슬리에서 열었으면 {y, m}
 */
function openItemSheet(key, items, edit, ym, message) {
  const editable = items.filter((it) => it.kind !== 'tt');
  const isSel = (it) => edit && it.ref && edit.ref && it.ref.kind === edit.ref.kind && it.ref.index === edit.ref.index;
  openSheet('<h2>' + dayLabel(key) + ' <button type="button" class="close" data-x>닫기</button></h2>' +
    (items.length ? '<ul class="item-list">' + items.map((it, n) => it.kind === 'tt'
      ? '<li><div class="ro">📚 ' + esc(it.text) + ' <span class="badge">시간표</span></div></li>'
      : '<li class="' + (isSel(it) ? 'sel' : '') + '"><button type="button" data-n="' + n + '">' + esc(it.text) + noteIcon(it.memo) +
        (it.kind === 'cal' ? ' <span class="badge">구글 캘린더</span>' : '') + '</button></li>').join('') + '</ul>' : '') +
    '<form class="form" id="item-form" autocomplete="off">' +
      '<label class="wide">' + (edit ? '일정 수정' : '새 일정') + '<input class="field" name="title" required placeholder="제목" value="' + esc(edit ? edit.title : '') + '"></label>' +
      '<label>시작 (선택)<input class="field" type="time" name="start" value="' + esc(edit ? edit.start : '') + '"></label>' +
      '<label>끝 (선택)<input class="field" type="time" name="end" value="' + esc(edit ? edit.end : '') + '"></label>' +
      '<label class="wide">메모 (선택)<textarea class="field memo-field" name="memo" rows="3" placeholder="목록에는 아이콘만 보이고, 구글 캘린더 설명에도 저장돼요">' + esc(edit ? edit.memo || '' : '') + '</textarea></label>' +
      '<p class="result wide" style="margin:0">' + (edit ? '수정·삭제하면 구글 캘린더에도 반영돼요' : '구글 캘린더에도 저장돼요 · 시작만 넣으면 종일 일정 + 제목 앞에 시간') + '</p>' +
      '<div class="result wide msg" id="item-msg">' + esc(message || '') + '</div>' +
      '<div class="sheet-actions wide" id="item-actions">' +
        (edit ? '<button type="button" class="btn-ghost btn-danger" id="item-del">삭제</button><button type="button" class="btn-ghost" id="item-new">새로 쓰기</button>' : '') +
        '<button type="submit" class="btn">' + (edit ? '수정 저장' : '일정 저장') + '</button></div>' +
    '</form>', (el) => {
    const msg = (t, bad) => { const m = $('#item-msg', el); m.textContent = t; m.classList.toggle('bad', !!bad); };
    // 결과 반영: 위클리·먼슬리 데이터 바로 바꾸고 다시 그림
    const apply = (res) => {
      if (res.day) applyDay(res.day);
      if (res.month) { S.month = res.month; store('month.' + res.month.y + '-' + res.month.m, res.month); }
      else if (S.month) loadMonth(); // 먼슬리 밖에서 바꿨으면 달력도 새로
      render();
      if (res.ok) { closeSheet(); if (ym) S.selDay = null; notice(res.message); render(); return; }
      const fresh = ym && S.month ? S.month.dates[parseKey(key).getDate() - 1].items : (dayOf(key) || {}).schedule || editable;
      openItemSheet(key, fresh, edit && fresh.find((it) => it.text === edit.text) ? edit : null, ym, res.message);
      $('#item-msg').classList.add('bad');
    };
    const fail = (err) => { msg('오류: ' + errText(err), true); $$('button', el).forEach((b) => { b.disabled = false; }); };
    const busy = (t) => { msg(t); $$('button', el).forEach((b) => { b.disabled = true; }); };
    $('[data-x]', el).addEventListener('click', () => { closeSheet(); if (ym) { S.selDay = null; render(); } });
    $$('.item-list [data-n]', el).forEach((b) => b.addEventListener('click', () => openItemSheet(key, items, items[+b.dataset.n], ym)));
    const nw = $('#item-new', el);
    if (nw) nw.addEventListener('click', () => openItemSheet(key, items, null, ym));
    const del = $('#item-del', el);
    if (del) del.addEventListener('click', () => {
      // 삭제 전 확인 (모바일에서도 되도록 화면 안에서)
      $('#item-actions', el).innerHTML = '<span class="grow confirm">정말 지울까요?</span>' +
        '<button type="button" class="btn-ghost" id="del-no">취소</button><button type="button" class="btn btn-del" id="del-yes">지우기</button>';
      $('#del-no', el).addEventListener('click', () => openItemSheet(key, items, edit, ym));
      $('#del-yes', el).addEventListener('click', () => {
        // 화면에서 먼저 지우고 창을 닫은 뒤, 저장은 뒤에서
        closeSheet();
        if (ym) S.selDay = null;
        localItems(key, (list) => list.filter((it) => !(it.ref && edit.ref && it.ref.kind === edit.ref.kind && it.ref.index === edit.ref.index)));
        render();
        save('webDeleteItem', key, edit.ref, ym ? ym.y : null, ym ? ym.m : null).then((res) => applyBg(res, key, ym));
      });
    });
    const requestId = newId(); // 이 입력창에서 한 번 = 한 요청 (연타·재시도해도 한 번만 저장)
    $('#item-form', el).addEventListener('submit', (e) => {
      e.preventDefault();
      if (el.dataset.saving) return; // 저장 중에는 잠금
      const f = new FormData(e.target);
      const item = { title: String(f.get('title') || '').trim(), start: normTime(f.get('start')), end: normTime(f.get('end')), memo: f.get('memo') };
      // 입력 확인은 화면에서 바로 (서버를 기다리지 않음)
      if (!item.title) return msg('제목을 입력해 주세요', true);
      if (item.end && !item.start) return msg('시작시간 확인', true);
      if (item.start && item.end && item.end <= item.start) return msg('끝시간 확인', true);
      el.dataset.saving = '1';
      // 화면에 먼저 반영하고 창을 닫음 → 구글 캘린더 저장은 뒤에서
      const text = (item.start ? item.start + (item.end ? '-' + item.end : '') + ' ' : '') + item.title;
      const temp = { kind: edit ? edit.kind : 'cal', text: text, title: item.title, start: item.start, end: item.end, memo: item.memo, done: false, pending: true, ref: edit ? edit.ref : null };
      localItems(key, (list) => {
        if (!edit) return list.concat([temp]);
        return list.map((it) => (it.ref && edit.ref && it.ref.kind === edit.ref.kind && it.ref.index === edit.ref.index ? temp : it));
      });
      closeSheet();
      if (ym) S.selDay = null;
      render();
      save('webSaveItem', key, edit ? edit.ref : null, item, ym ? ym.y : null, ym ? ym.m : null, requestId).then((res) => applyBg(res, key, ym));
    });
  });
}

/** 그날 일정 목록을 화면 데이터에서 바로 고치기 (하루 화면 + 먼슬리 칸) */
function localItems(key, change) {
  const day = dayOf(key);
  if (day) day.schedule = change(day.schedule);
  if (S.month && key.slice(0, 7) === S.month.y + '-' + pad(S.month.m)) {
    const c = S.month.dates[parseKey(key).getDate() - 1];
    if (c) c.items = change(c.items);
  }
}

/** 뒤에서 끝난 일정 저장·삭제 결과 반영 (실패하면 짧게 안내하고 서버 값으로) */
function applyBg(res, key, ym) {
  if (!res) return; // 네트워크 오류는 save()가 안내 + 다시 불러옴
  if (res.day) applyDay(res.day);
  if (res.month) { S.month = res.month; store('month.' + res.month.y + '-' + res.month.m, res.month); }
  else if (S.month) loadMonth();
  if (!res.ok) notice(res.message, true);
  if (!isEditing()) render();
}

function monthNavHtml() {
  return '<div class="month-nav"><button type="button" class="icon-btn" id="m-prev" aria-label="이전 달">‹</button>' +
    '<b>' + S.ym.y + '년 ' + S.ym.m + '월</b><button type="button" class="icon-btn" id="m-next" aria-label="다음 달">›</button></div>';
}

function bindMonthNav() {
  const move = (n) => {
    const d = new Date(S.ym.y, S.ym.m - 1 + n, 1);
    S.ym = { y: d.getFullYear(), m: d.getMonth() + 1 };
    S.selDay = null;
    render();
    loadMonth();
  };
  $('#m-prev').addEventListener('click', () => move(-1));
  $('#m-next').addEventListener('click', () => move(1));
}

/** 일별 기분 꺾은선 (SVG) */
function moodChart(M) {
  const W = 320, H = 140, L = 22, R = 8, T = 10, B = 22;
  const x = (day) => L + ((day - 1) / Math.max(M.days - 1, 1)) * (W - L - R);
  const y = (s) => T + ((5 - s) / 4) * (H - T - B);
  const pts = M.dates.filter((c) => c.mood).map((c) => [x(c.day), y(c.mood)]);
  let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">';
  for (let s = 1; s <= 5; s++) {
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(s) + '" y2="' + y(s) + '" stroke="#EFECE5"/>' +
      '<text x="4" y="' + (y(s) + 4) + '" font-size="10" fill="#999">' + s + '</text>';
  }
  [1, 10, 20, M.days].forEach((d) => { svg += '<text x="' + x(d) + '" y="' + (H - 6) + '" font-size="10" fill="#999" text-anchor="middle">' + d + '</text>'; });
  if (pts.length) {
    svg += '<polyline fill="none" stroke="#2F5D50" stroke-width="2.5" stroke-linejoin="round" points="' + pts.map((p) => p.join(',')).join(' ') + '"/>';
    svg += pts.map((p) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="#2F5D50"/>').join('');
  } else {
    svg += '<text x="' + W / 2 + '" y="' + H / 2 + '" font-size="12" fill="#999" text-anchor="middle">아직 기분 기록이 없어요</text>';
  }
  return svg + '</svg>';
}

/* ---------- 타임라인 ---------- */
function loadTimeline(key) {
  S.tl.key = key;
  S.tl.slots = null;
  render();
  call('webGetTimeline', key).then((res) => {
    if (res.key !== S.tl.key) return;
    S.tl.slots = res.slots;
    if (S.tab === 'timeline') render();
  }).catch((err) => notice('타임라인을 불러오지 못했어요 · ' + errText(err), true));
}

function catColor(name) {
  const c = S.boot.categories.find((x) => x.name === name);
  return c ? c.color : '';
}

function fmtMin(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return (h ? h + '시간 ' : '') + (m || !h ? m + '분' : '');
}

function renderTimeline() {
  if (!S.tl.key) { loadTimeline(S.boot.todayKey); return; }
  const cats = S.boot.categories;
  if (S.tl.brush === null && cats.length) S.tl.brush = cats[0].name;
  const d = parseKey(S.tl.key);
  const nav = '<div class="month-nav"><button type="button" class="icon-btn" id="t-prev" aria-label="전날">‹</button>' +
    '<b>' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WEEKDAYS[(d.getDay() + 6) % 7] + '</b>' +
    '<button type="button" class="icon-btn" id="t-next" aria-label="다음 날">›</button></div>';
  const brushes = '<div class="brushes">' + cats.map((c) => '<button type="button" class="brush' + (S.tl.brush === c.name ? ' on' : '') +
    '" data-cat="' + esc(c.name) + '"><i style="background:' + c.color + '"></i>' + esc(c.name) + '</button>').join('') +
    '<button type="button" class="brush' + (S.tl.brush === '' ? ' on' : '') + '" data-cat=""><i style="background:#FAF8F3;border:1px solid #ccc"></i>지우개</button></div>';

  if (!S.tl.slots) {
    $('#view').innerHTML = nav + brushes + '<p class="empty">불러오는 중…</p>';
    bindTimelineNav();
    return;
  }
  const now = new Date();
  const nowSlot = S.tl.key === keyOf(now) ? Math.floor((now.getHours() * 60 + now.getMinutes()) / SLOT_MIN) : -1;
  let grid = '';
  for (let h = 0; h < 24; h++) {
    grid += '<div class="hr">' + pad(h) + '</div>';
    for (let k = 0; k < 6; k++) {
      const i = h * 6 + k, cat = S.tl.slots[i];
      grid += '<div class="slot' + (i === nowSlot ? ' now' : '') + '" data-i="' + i + '"' +
        (cat ? ' style="background:' + catColor(cat) + '"' : '') + '></div>';
    }
  }
  $('#view').innerHTML = nav + brushes +
    '<div class="tl-wrap" style="margin-top:12px"><div class="card"><div class="tl-head"><span></span>' +
      ['00', '10', '20', '30', '40', '50'].map((m) => '<span>' + m + '</span>').join('') + '</div>' +
      '<div class="tl" id="tl">' + grid + '</div></div>' +
    '<div class="card" id="totals">' + totalsHtml() + '</div></div>';

  bindTimelineNav();
  $$('.brush').forEach((el) => el.addEventListener('click', () => { S.tl.brush = el.dataset.cat; render(); }));
  bindPaint($('#tl'));
  const cur = $('.slot.now');
  if (cur && S.tl.firstShow !== S.tl.key) { S.tl.firstShow = S.tl.key; cur.scrollIntoView({ block: 'center' }); }
}

function totalsHtml() {
  const sum = {};
  S.tl.slots.forEach((c) => { if (c) sum[c] = (sum[c] || 0) + SLOT_MIN; });
  const all = Object.values(sum).reduce((a, b) => a + b, 0);
  const rows = Object.keys(sum).sort((a, b) => sum[b] - sum[a]).map((c) =>
    '<div class="total"><i style="background:' + catColor(c) + '"></i><span>' + esc(c) + '</span><span>' + fmtMin(sum[c]) + '</span></div>');
  return '<h3>오늘 합계 <small>' + fmtMin(all) + ' 기록</small></h3>' + (rows.join('') || '<p class="result">칸을 눌러 색칠해 보세요</p>');
}

function bindTimelineNav() {
  const move = (n) => {
    flushTimeline();
    loadTimeline(keyOf(addDays(parseKey(S.tl.key), n)));
  };
  $('#t-prev').addEventListener('click', () => move(-1));
  $('#t-next').addEventListener('click', () => move(1));
}

/** 칸 칠하기: 누르면 칠하기/지우기, 마우스는 끌어서 여러 칸 (터치는 끌면 스크롤) */
function bindPaint(grid) {
  const apply = (el) => {
    if (!el || !el.classList.contains('slot')) return;
    const i = +el.dataset.i, val = S.tl.mode === 'erase' ? '' : S.tl.brush;
    if (S.tl.slots[i] === val) return;
    S.tl.slots[i] = val;
    el.style.background = val ? catColor(val) : '';
  };
  grid.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.slot');
    if (!el) return;
    const cur = S.tl.slots[+el.dataset.i];
    S.tl.mode = !S.tl.brush || cur === S.tl.brush ? 'erase' : 'paint';
    apply(el);
    S.tl.painting = e.pointerType === 'mouse';
    afterPaint();
  });
  grid.addEventListener('pointermove', (e) => {
    if (!S.tl.painting) return;
    apply(document.elementFromPoint(e.clientX, e.clientY));
  });
  grid.addEventListener('pointercancel', stopPaint);
}

function stopPaint() {
  if (S.tl.painting) { S.tl.painting = false; afterPaint(); }
}

/** 합계 갱신 + 잠시 뒤 저장 (연속으로 칠하면 한 번에) */
function afterPaint() {
  const t = $('#totals');
  if (t) t.innerHTML = totalsHtml();
  clearTimeout(S.tl.timer);
  S.tl.timer = setTimeout(flushTimeline, 800);
}

function flushTimeline() {
  if (!S.tl.timer) return;
  clearTimeout(S.tl.timer);
  S.tl.timer = null;
  save('webSetTimeline', S.tl.key, S.tl.slots.slice());
}

/* ---------- 아이폰 노치·하단 바 보정 ---------- */
// 웹앱은 구글 페이지 안 iframe이라 env(safe-area-inset-*)가 0으로 나올 수 있음 → 노치 있는 아이폰이면 기본값 사용
function fixSafeArea() {
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;padding-bottom:env(safe-area-inset-bottom);padding-top:env(safe-area-inset-top)';
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe);
  const bottom = parseFloat(cs.paddingBottom) || 0, top = parseFloat(cs.paddingTop) || 0;
  probe.remove();
  const iPhone = /iPhone/.test(navigator.userAgent);
  const notch = iPhone && Math.max(screen.width, screen.height) >= 812; // X 이후 모델
  const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  if (notch && bottom === 0) document.documentElement.style.setProperty('--sab', '24px');
  if (notch && standalone && top === 0) document.documentElement.style.setProperty('--sat', '47px');
}

/* ---------- 시작 ---------- */
$$('.tabs button').forEach((b) => b.addEventListener('click', () => {
  if (S.tab === 'timeline') flushTimeline();
  if (S.tab === b.dataset.tab && S.tab === 'week' && S.detail) { closeDetail(); return; } // 위클리 탭 다시 누르면 목록으로
  S.tab = b.dataset.tab;
  S.edit = null;
  writePref('tab', S.tab);
  render();
  if (S.tab === 'month') loadMonth();
  window.scrollTo(0, 0);
}));
$('#back').addEventListener('click', () => {
  if (hist) {
    history.back(); // 구글 웹앱 기록에서 한 단계 뒤로 → setChangeHandler가 닫음
    setTimeout(() => { if (S.detail) closeDetail(); }, 400);
  } else {
    closeDetail();
  }
});
$('#sheet-bg').addEventListener('click', (e) => { if (e.target.id === 'sheet-bg') closeSheet(); });
window.addEventListener('pointerup', stopPaint);
// 폰: 오늘 탭에서 좌우로 밀면 전날·다음 날
(function () {
  let x0 = null, y0 = 0;
  $('#view').addEventListener('touchstart', (e) => {
    if (S.tab !== 'today' || isEditing() || e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  $('#view').addEventListener('touchend', (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) moveDay(dx < 0 ? 1 : -1);
  }, { passive: true });
})();
$('#refresh').addEventListener('click', () => { reload(true); });
// 시트에서 바꾼 내용 반영: 화면으로 돌아올 때 + 1분마다 (입력·편집 중·저장 중이면 건너뜀)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { flushTimeline(); return; }
  if (Date.now() - S.lastLoad > 20000 && !S.pending && !isEditing()) reload(false);
});
setInterval(() => {
  if (!document.hidden && !S.pending && !isEditing() && !S.tl.painting) reload(false);
}, 60000);

/** 처음 열 때 주소의 꼬리표 (#day-2026-11-12 → 'day-2026-11-12') */
function readStartHash() {
  return new Promise((resolve) => {
    try {
      google.script.url.getLocation((loc) => resolve(String(loc.hash || '')));
    } catch (e) {
      resolve(location.hash.replace(/^#/, '')); // 미리보기 등 Apps Script 밖
    }
  });
}

/**
 * 시작: 주소에 #day-날짜가 남아 있으면 (예전에 연 요일 상세) 그 화면으로 가지 않고 기본 화면(오늘 탭)으로.
 * 오늘 날짜면 오늘 탭이 바로 그날 화면이고, 다른 날짜는 무시. 남은 꼬리표는 지움
 */
async function start() {
  fixSafeArea();
  const hash = await readStartHash();
  if (/^day-\d{4}-\d{2}-\d{2}$/.test(hash)) {
    S.tab = 'today';
    S.detail = null;
    writePref('tab', 'today');
    if (hist) hist.replace(null, {}, '');
  }
  const saved = restore('boot'); // 마지막으로 불러온 데이터를 먼저 보여 줌
  if (saved && saved.week) {
    S.boot = saved;
    S.weeks = restore('weeks') || {};
    applyWeek(saved.week);
    S.dayKey = keyOf(new Date()); // 기기 날짜 기준 오늘 (서버가 맞춰 줌)
  }
  render();
  reload(false).then(() => {
    // 처음 화면이 뜬 뒤 여유 있을 때 이번 달 먼슬리를 미리 받아 둠
    setTimeout(() => { if (S.tab !== "month" && S.boot) prefetchMonth(); }, 1500);
  });
}

/** 이번 달 먼슬리 미리 받아 두기 (화면은 안 바꿈) */
function prefetchMonth() {
  const t = parseKey(S.boot.todayKey);
  call('webGetMonth', t.getFullYear(), t.getMonth() + 1)
    .then((data) => store('month.' + data.y + '-' + data.m, data)).catch(() => { /* 미리 받기 실패는 무시 */ });
}

start();
</script>
