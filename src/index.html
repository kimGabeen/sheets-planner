<body>
  <header class="top">
    <button id="back" class="icon-btn" type="button" aria-label="뒤로" hidden>

    </button>
    <h1 id="title">오늘</h1>
    <span id="saving" class="saving"></span>

    <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>

  <nav class="tabs" aria-label="화면">
