<style>
  /* 색·크기 (디자인 기준값) */
  :root {
    --bg: #FAF8F3;
    --main: #2F5D50;
    --point: #E3EDE8;
    --text: #333333;
    --sub: #999999;
    --card: #FFFFFF;
    --line: #EFECE5;
    --radius: 12px;
    --tap: 44px;
    --nav-h: 64px;
    /* 아이폰 노치·하단 바 (iframe 안에서 0이면 app.html이 보정값을 넣음) */
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    font-size: 16px; line-height: 1.45;
    /* 맨 아래 내용이 탭바 뒤로 숨지 않게 탭바 높이 + 하단 바 + 여유만큼 */
    padding-bottom: calc(var(--nav-h) + var(--sab) + 32px);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  h1, h2, h3 { margin: 0; }
  h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; }
  h3 small { font-size: 13px; font-weight: 500; color: var(--sub); }

  /* 상단바 */
  .top {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; gap: 8px;
    padding: calc(var(--sat) + 12px) 20px 8px;
    max-width: 1240px; margin: 0 auto;
  }
  .top h1 { font-size: 22px; font-weight: 800; flex: 1; }
  .saving { font-size: 12px; color: var(--sub); }
  .icon-btn { width: var(--tap); height: var(--tap); border-radius: 50%; display: grid; place-items: center; color: var(--main); }
  .icon-btn:active { background: var(--point); }

  main { max-width: 1240px; margin: 0 auto; padding: 4px 16px 0; }
  .empty { color: var(--sub); text-align: center; padding: 40px 0; }

  /* 카드: 그림자 없이 여백·흰 바탕으로 구분 */
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .grid-2 { display: grid; gap: 0 12px; }
  @media (min-width: 768px) { .grid-2 { grid-template-columns: 1fr 1fr; align-items: start; } }

  /* 오늘 상단 */
  .hero { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 16px; }
  .hero .date { font-size: 24px; font-weight: 800; }
  .hero .sub { color: var(--sub); font-size: 14px; margin-top: 2px; }
  .ring { width: 72px; height: 72px; position: relative; }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; color: var(--main); font-size: 16px; }

  /* 일정 */
  .sched { list-style: none; margin: 0; padding: 0; }
  .sched li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .sched li:last-child { border-bottom: 0; }
  .sched li.memo { color: var(--sub); }
  .sched .none { color: var(--sub); }

  /* 할 일: 체크 | (시간 꼬리표) 내용 — 내용은 줄바꿈으로 전부 보이게 */
  .todo { display: flex; align-items: flex-start; gap: 10px; min-height: 50px; padding: 11px 4px; border-bottom: 1px solid var(--line); border-radius: 8px; }
  .todo:last-of-type { border-bottom: 0; }
  .check {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--main); display: grid; place-items: center; color: #fff;
    position: relative; margin-top: -2px;
  }
  .check::after { content: ''; position: absolute; inset: -9px; } /* 터치 영역 넓히기 */
  .check.on { background: var(--main); }
  .check.on::before { content: '✓'; font-size: 15px; font-weight: 800; }
  .todo .body { flex: 1; min-width: 0; text-align: left; font-size: 15px; line-height: 1.45; cursor: pointer; }
  .todo .tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--main); background: var(--point); border-radius: 6px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
  .todo .txt { white-space: pre-wrap; overflow-wrap: anywhere; word-break: keep-all; }
  .todo.done { background: var(--point); }
  .todo.done .txt { text-decoration: line-through; color: var(--sub); }
  .todo.done .tag { background: #fff; color: var(--sub); }
  .todo.missed .txt { color: var(--sub); }
  .add-todo { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 4px; color: var(--sub); font-size: 15px; white-space: nowrap; }
  .add-todo::before { content: '+'; width: 28px; height: 28px; border-radius: 50%; border: 2px dashed #CFCAC0; display: grid; place-items: center; font-weight: 700; color: #B8B2A6; flex: 0 0 auto; }
  /* 할 일 편집 줄 */
  .todo.editing { background: var(--bg); flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }
  .todo.editing textarea { width: 100%; border: 0; outline: none; resize: none; background: #fff; border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 15px; min-height: 44px; }
  .ed-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ed-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
  .ed-row input[type=time] { border: 0; background: #fff; border-radius: 8px; min-height: 40px; padding: 0 10px; font: inherit; }
  .ed-row .grow { flex: 1; }
  .btn-sm { min-height: 40px; padding: 0 14px; border-radius: 8px; background: var(--main); color: #fff; font-weight: 700; font-size: 14px; }
  .btn-ghost { min-height: 40px; padding: 0 12px; border-radius: 8px; color: var(--sub); font-size: 14px; }
  .btn-danger { color: #8A3B2E; }
  .compact .todo { min-height: 40px; padding: 8px 2px; gap: 8px; }
  .compact .check { width: 22px; height: 22px; margin-top: 0; }
  .compact .check.on::before { font-size: 12px; }
  .compact .todo .body { font-size: 14px; }
  .compact .add-todo { min-height: 40px; font-size: 14px; }
  .compact .add-todo::before { width: 22px; height: 22px; }
  .carry { list-style: none; margin: 0; padding: 0; color: var(--sub); }
  .carry li { padding: 6px 0; }

  /* 습관: 동그란 칩 */
  .habits { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 12px 8px; }
  .habit { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--text); text-align: center; }
  .habit .dot {
    width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--main);
    display: grid; place-items: center; font-weight: 700; color: var(--main); font-size: 14px; transition: background .15s;
  }
  .habit.on .dot { background: var(--main); color: #fff; }
  .habit .name { line-height: 1.25; word-break: keep-all; }

  .link-btn { font-size: 13px; font-weight: 600; color: var(--main); min-height: 32px; padding: 0 4px; }

  /* 기분 */
  .moods { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 12px; }
  .mood { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line); font-size: 26px; display: grid; place-items: center; filter: grayscale(.6); opacity: .7; }
  .mood.on { border-color: var(--main); background: var(--point); filter: none; opacity: 1; }

  /* 입력 */
  .field { width: 100%; border: 0; border-radius: 10px; background: var(--bg); padding: 12px 14px; min-height: var(--tap); outline: none; }
  .field:focus { background: var(--point); }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form .wide { grid-column: 1 / -1; }
  .form label { font-size: 12px; color: var(--sub); display: grid; gap: 4px; }
  .form label .field { font-size: 15px; color: var(--text); }
  .btn { min-height: var(--tap); border-radius: 10px; background: var(--main); color: #fff; font-weight: 700; padding: 0 18px; }
  .btn:disabled { opacity: .5; }
  .result { font-size: 13px; color: var(--sub); min-height: 18px; }
  .row-check { display: flex; align-items: center; gap: 10px; min-height: 48px; border-bottom: 1px solid var(--line); }
  .row-check:last-child { border-bottom: 0; }
  .row-check input { flex: 1; border: 0; outline: none; background: transparent; min-height: 40px; }
  .row-check.done input { text-decoration: line-through; color: var(--sub); }

  /* 위클리 */
  .week-head { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 12px; }
  .week-head b { font-size: 18px; }
  .week-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 10px; }
  .chip-btn { min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--card); font-size: 14px; font-weight: 600; color: var(--main); }
  .chip-btn.on { background: var(--main); color: #fff; }
  .days { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 16px 8px; margin: 0 -16px; scrollbar-width: none; }
  .days::-webkit-scrollbar { display: none; }
  .day { flex: 0 0 86%; min-width: 240px; scroll-snap-align: center; margin-bottom: 0; cursor: pointer; }
  @media (min-width: 768px) { .day { flex: 0 0 280px; scroll-snap-align: start; } }
  /* 7칸 한 줄 보기 (토글) */
  .days.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); overflow: visible; margin: 0; padding: 0; gap: 8px; }
  .days.grid7 .day { min-width: 0; padding: 12px 10px; }
  .day.today { outline: 2px solid var(--main); outline-offset: -2px; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .day-head b { font-size: 15px; }
  .day-head span { font-size: 13px; color: var(--main); font-weight: 700; }
  .day .sched li { font-size: 12px; padding: 3px 0; border: 0; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .mood-line { font-size: 13px; color: var(--sub); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .habit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .habit-table th { font-weight: 600; color: var(--sub); padding: 6px 2px; }
  .habit-table td { text-align: center; padding: 4px 2px; }
  .habit-table td:first-child { text-align: left; white-space: nowrap; padding-right: 8px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .hcell { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--point); }
  .hcell.on { background: var(--main); border-color: var(--main); }
  .scroll-x { overflow-x: auto; }

  /* 먼슬리 */
  .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 0 12px; }
  .month-nav b { font-size: 18px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .wd { text-align: center; font-size: 12px; color: var(--sub); padding: 4px 0; }
  .cal .cell { min-height: 58px; border-radius: 10px; padding: 6px; text-align: left; display: flex; flex-direction: column; gap: 3px; background: var(--bg); }
  .cal .cell.blank { background: transparent; }
  .cal .cell.today { background: var(--point); }
  .cal .cell.sel { outline: 2px solid var(--main); outline-offset: -2px; }
  .cal .num { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .cal .mdot { width: 9px; height: 9px; border-radius: 50%; }
  .cal .ev { font-size: 10px; line-height: 1.3; color: var(--main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--point); border-radius: 4px; padding: 1px 3px; }
  .cal .ev.memo { background: #F1EDE4; color: var(--text); }
  .cal .more { font-size: 10px; color: var(--sub); }
  @media (min-width: 768px) {
    .cal .cell { min-height: 96px; }
    .cal .ev { font-size: 11px; }
  }
  .item-list { list-style: none; margin: 0 0 12px; padding: 0; }
  .item-list li { border-bottom: 1px solid var(--line); }
  .item-list button, .item-list .ro { width: 100%; min-height: 46px; text-align: left; display: flex; align-items: center; gap: 8px; font-size: 15px; padding: 6px 2px; }
  .item-list .badge { font-size: 11px; color: var(--sub); background: var(--bg); border-radius: 6px; padding: 2px 6px; flex: 0 0 auto; }
  .item-list li.sel button { color: var(--main); font-weight: 700; }
  .bar { height: 8px; background: var(--point); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--main); border-radius: 4px; }
  .rate-row { display: grid; grid-template-columns: minmax(70px, 30%) 1fr 44px; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; }
  .rate-row span:last-child { text-align: right; color: var(--sub); font-size: 13px; }
  .chart { width: 100%; height: auto; display: block; }

  /* 타임라인 */
  .brushes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .brush { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 14px; border-radius: 999px; background: var(--card); font-size: 14px; border: 2px solid transparent; }
  .brush i { width: 14px; height: 14px; border-radius: 50%; }
  .brush.on { border-color: var(--main); font-weight: 700; }
  .tl { display: grid; grid-template-columns: 34px repeat(6, minmax(0, 1fr)); gap: 3px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .tl .hr { font-size: 11px; color: var(--sub); display: flex; align-items: center; }
  .slot { height: 30px; border-radius: 5px; background: var(--bg); }
  .slot.now { box-shadow: inset 0 0 0 2px var(--main); }
  .tl-head { display: grid; grid-template-columns: 34px repeat(6, minmax(0, 1fr)); gap: 3px; font-size: 10px; color: var(--sub); margin-bottom: 4px; }
  .total { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; min-height: 36px; font-size: 14px; }
  .total i { width: 14px; height: 14px; border-radius: 50%; }
  .total span:last-child { color: var(--sub); font-size: 13px; }
  @media (min-width: 900px) {
    .tl-wrap { display: grid; grid-template-columns: 1fr 320px; gap: 12px; align-items: start; }
  }

  /* 안내 문구 (저장 실패 등) */
  .notice {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--nav-h) + var(--sab) + 12px);
    background: var(--text); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 999px;
    max-width: calc(100% - 32px); z-index: 20;
  }
  .notice.error { background: #8A3B2E; }

  /* 아래 탭 */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--bg); border-top: 1px solid var(--line); /* 불투명: 뒤 글자가 비치지 않게 */
    padding-bottom: var(--sab);
  }
  .tabs button { height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--sub); font-size: 11px; }
  .tabs svg { width: 24px; height: 24px; }
  .tabs button.on { color: var(--main); font-weight: 700; }

  /* 아래에서 올라오는 입력창 */
  .sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(51, 51, 51, .35); display: flex; align-items: flex-end; justify-content: center; }
  .sheet-bg[hidden] { display: none; }
  .sheet {
    width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--card);
    border-radius: 16px 16px 0 0; padding: 18px 16px calc(var(--sab) + 18px);
  }
  .sheet h2 { font-size: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .sheet .close { font-size: 14px; color: var(--sub); min-height: 40px; padding: 0 6px; }
  .form label.switch { display: flex; font-size: 15px; color: var(--text); }
  .switch { display: flex; align-items: center; justify-content: space-between; min-height: 48px; font-size: 15px; gap: 12px; }
  .switch input { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 999px; background: #DDD8CE; position: relative; flex: 0 0 auto; transition: background .15s; }
  .switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch input:checked { background: var(--main); }
  .switch input:checked::after { left: 23px; }
  .edit-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; margin-bottom: 6px; }
  .edit-row .field { min-height: 44px; }
  .mini { width: 40px; height: 40px; border-radius: 10px; background: var(--bg); color: var(--main); font-size: 16px; }
  .mini:disabled { opacity: .3; }
  .tt-row { display: grid; grid-template-columns: 64px 1fr 1fr 40px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .tt-row .name { grid-column: 1 / 4; }
  .tt-row select, .tt-row input { min-height: 44px; }
  .tt-day { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 14px; }
  .sheet-actions .btn { flex: 1; }

  /* 일요일·공휴일 */
  .red { color: #D0453A !important; }
  .holiday { font-size: 11px; color: #D0453A; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero .holiday { font-size: 13px; margin-top: 2px; }
  .cal .holiday { font-size: 10px; }

  /* 일정 목록: 누르면 수정 */
  .sched-item { width: 100%; text-align: left; font-size: 15px; min-height: 40px; padding: 8px 0; }
  .sched.tap li { padding: 0; }
  .sched li.tt { color: var(--text); }

  /* 새로고침 중: 아이콘만 살짝 돎 */
  @keyframes spin { to { transform: rotate(360deg); } }
  #refresh.spin svg { animation: spin 1s linear infinite; }

  /* 입력창 메시지·삭제 확인 */
  .result.bad { color: #8A3B2E; }
  .confirm { font-size: 15px; font-weight: 700; color: #8A3B2E; display: flex; align-items: center; }
  .btn-del { background: #8A3B2E; flex: 0 0 auto !important; }
  .sheet-actions .grow { flex: 1; }
</style>
